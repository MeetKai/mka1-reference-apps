[project]
name = "mka1-ticket-triage"
version = "0.1.0"
license = "Apache-2.0"
description = "A runnable customer-support routing application using the MKA1 Python SDK."
requires-python = ">=3.12"
dependencies = [
  "meetkai-mka1==0.12.80",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "python-dotenv==1.2.4",
  "pydantic==2.14.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
